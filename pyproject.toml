[project]
name = "quant-head"
version = "0.1.0"
description = "Standalone INT8 quantization for embeddings and LM heads"
dependencies = ["torch>=2.0", "transformers>=4.40"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]